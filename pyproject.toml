[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevbt"
version = "0.1.0"
description = "Backtesting of trading strategies with technical indicators, LLM fundamentals and Jev decisions"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "David Nevado Martín" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
